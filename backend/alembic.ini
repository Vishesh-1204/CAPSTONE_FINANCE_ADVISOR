# backend/alembic.ini
#
# Purpose: configuration for Alembic, the database migration tool.
# Run commands from the backend/ folder (inside Docker: /app), e.g.
#   alembic upgrade head        apply every migration not yet applied
#   alembic current             show which revision the database is at
#   alembic revision -m "..."   create a new, empty migration file
#
# The database URL is NOT written here: migrations/env.py reads it from
# app.core.config.settings (i.e. DATABASE_URL in .env), so secrets stay in .env.

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
