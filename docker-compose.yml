name: capstone-finance-advisor

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"     # local dev image includes pytest + reportlab (requirements-dev.txt)
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      # Wait until Postgres actually accepts connections (not just "container
      # started"), otherwise `alembic upgrade head` can fail on first boot.
      db:
        condition: service_healthy

  # Optional FinBERT backend (Phase 7A-4). Not started by a plain `docker compose up`:
  #   docker compose --profile ml up --build      -> http://127.0.0.1:8001 (same database)
  # Same code and database as `backend`, plus torch (CPU) + transformers, with the FinBERT
  # scorer switched on. The model downloads on first use into the hf_cache volume.
  backend-ml:
    profiles: ["ml"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
        INSTALL_ML: "true"
    image: capstone-finance-advisor-backend-ml
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      SENTIMENT_SCORER: finbert
      HF_HOME: /hf-cache          # keep the downloaded model across container rebuilds
    volumes:
      - ./backend:/app
      - hf_cache:/hf-cache
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  hf_cache:
